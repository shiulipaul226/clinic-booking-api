spring:
  application:
    name: clinic-booking-api
  datasource:
    # Zero-setup default: in-memory H2 (data resets on restart).
    # Use the "postgres" profile for PostgreSQL (see application-postgres.yml).
    url: jdbc:h2:mem:clinic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # the schema is owned by Flyway (db/migration), never generated by Hibernate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}            # cloud hosts (Render, Railway...) inject PORT

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Override in real deployments: JWT_SECRET must be at least 32 characters.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    expiration-minutes: 120
  admin:
    email: ${ADMIN_EMAIL:admin@clinic.com}
    password: ${ADMIN_PASSWORD:Admin@123}
  seed-demo-data: ${SEED_DEMO_DATA:true}

clinic:
  timezone: Asia/Kolkata
  cancellation-window-hours: 2
  reminder:
    enabled: true
    lead-hours: 24
    poll-interval-ms: 60000
