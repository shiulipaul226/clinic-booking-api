# docker compose up --build        -> PostgreSQL + the API, on http://localhost:8080
# docker compose up -d db          -> only PostgreSQL (run the API from your IDE/Maven with the "postgres" profile)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    ports:
      - "5432:5432"
    volumes:
      - clinic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/clinic
      DB_USER: clinic
      DB_PASSWORD: clinic
      JWT_SECRET: change-me-to-a-long-random-string-0123456789
    ports:
      - "8080:8080"

volumes:
  clinic-pgdata:
